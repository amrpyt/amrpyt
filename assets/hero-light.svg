<circle cx="747" cy="70" r="6" fill="#F87171"/><circle cx="769" cy="70" r="6" fill="#FBBF24"/><circle cx="791" cy="70" r="6" fill="#34D399"/>
<text x="833" y="77" font-family="Consolas, Menlo, monospace" font-size="15" fill="#4D6F83">engineer.ts</text>
