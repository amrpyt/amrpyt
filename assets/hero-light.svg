<rect x="334" y="309" rx="10" width="116" height="31" fill="#E2F5F3" stroke="#B9D7E5"/><text x="356" y="330" fill="#146C65">FULL-STACK</text>
</g>
<g>
<rect x="720" y="40" width="422" height="291" rx="19" fill="#FFFFFF" stroke="#B9D7E5" stroke-width="1.7"/>
