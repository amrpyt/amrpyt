<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">Amr Emad — AI Systems Engineer</title>
<desc id="desc">A custom teal and blue engineering banner with a code window illustration.</desc>
<defs>
