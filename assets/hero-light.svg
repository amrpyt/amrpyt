<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#142E40" opacity=".065"/></pattern>
<linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087F77"/><stop offset="1" stop-color="#3D6AC0"/></linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="1198" height="368" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
