<text x="64" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="83" font-weight="800" letter-spacing="-2.5" fill="#142E40">AMR EMAD<tspan fill="#087F77">.</tspan></text>
<text x="68" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2.6" fill="#142E40">AI SYSTEMS ENGINEER</text>
